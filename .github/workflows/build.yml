name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: memo-todo
            path: "."
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      # CLT 6.1.1.280：与工程 modelVersion 6.1.1 / faMode 匹配（勿随手升 26.x，老工程形态可能不兼容）
      - name: Setup HarmonyOS Command Line Tools
        id: ohos
        uses: ErBWs/setup-ohos@v2
        with:
          version: 6.1.1.280
          cache: true

      - name: Ensure toolchain on PATH
        run: |
          for p in "$HOME/ohos-sdk/command-line-tools/bin" "$HOME/ohos-sdk/command-line-tools/tool/node/bin"; do
            if [ -d "$p" ]; then echo "$p" >> "$GITHUB_PATH"; fi
          done
          if [ -d "$HOME/ohos-sdk/command-line-tools/sdk" ]; then
            echo "HOS_SDK_HOME=$HOME/ohos-sdk/command-line-tools/sdk" >> "$GITHUB_ENV"
          fi
          echo "--- toolchain check ---"
          command -v hvigorw || true
          command -v ohpm || true

      - name: Install project dependencies
        working-directory: ${{ matrix.path }}
        run: ohpm install --all

      - name: Build unsigned App
        working-directory: ${{ matrix.path }}
        run: hvigorw assembleApp --mode project -p product=default -p buildMode=release --no-daemon --accept-license

      - name: Sanitize packed config.json (Lite schema)
        run: python3 scripts/clean_config_in_app.py "${{ matrix.path }}"/build/outputs/default/*.app

      # jsrsasign 概率性会签出坏签名（2026-10-05 实测：release 包用三张证书都验不过 → 表端报 30 签名验证失败，
      # 而同链路的专注/txtreader/debug 包都验得过）。所以签完必须本地验签，不过就重签。
      - name: Sign with self-verify retry (needs certs/app.p7b)
        run: |
          mkdir -p dist
          if [ -f certs/app.p7b ]; then
            cp -r tools/sign /tmp/sign && cd /tmp/sign
            npm install --no-audit --no-fund
            cd -
            python3 -m pip install -q asn1crypto cryptography
            for i in 1 2 3 4 5; do
              FORCE_P7B_BUNDLE=1 node /tmp/sign/sign-app-to-hap.js "${{ matrix.path }}"/build/outputs/default/*.app certs/app.p7b "dist/${{ matrix.project }}.hap"
              if python3 scripts/verify_hap_sig.py "dist/${{ matrix.project }}.hap" >/dev/null 2>&1; then
                echo "本地验签通过（第 ${i} 次签名）"
                break
              fi
              echo "第 ${i} 次签名本地验签失败 → 重签"
              if [ "$i" = "5" ]; then echo "5 次签名均未通过，终止"; exit 1; fi
            done
          else
            echo "certs/app.p7b 不存在 → 本次只交付未签名 .app"
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp "${{ matrix.path }}"/build/outputs/default/*.app dist/ 2>/dev/null || true
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
